name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: App bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk TapControl.apk

      - name: Als Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TapControl – neueste Version
          files: TapControl.apk
          make_latest: true
